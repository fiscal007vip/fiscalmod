<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIP CLIENT FISCAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap');

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Orbitron', sans-serif;
}

:root{
    --fondo: #080412;
    --morado: #9933ff;
    --morado-claro: #bb66ff;
    --morado-fuerte: #7700ee;
    --texto: #f2e6ff;
    --borde: rgba(153,51,255,0.35);
    --error: #ff3355;
}

@keyframes brilloTitulo{
    0%{ text-shadow: 0 0 12px var(--morado), 0 0 25px var(--morado-fuerte); }
    50%{ text-shadow: 0 0 22px var(--morado-claro), 0 0 45px var(--morado); }
    100%{ text-shadow: 0 0 12px var(--morado), 0 0 25px var(--morado-fuerte); }
}

@keyframes bordeAnim{
    0%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
}

@keyframes entrada{
    from{ opacity:0; transform: scale(0.85) translateY(25px); }
    to{ opacity:1; transform: scale(1) translateY(0); }
}

@keyframes temblor{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-4px); }
    75%{ transform: translateX(4px); }
}

body{
    background: radial-gradient(circle at top, #200040, #080412 48%, #05020a);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: entrada 0.6s ease-out;
}

.contenedor{
    width: 100%;
    max-width: 455px;
    border-radius: 28px;
    padding: 34px 24px;
    background: rgba(8,4,18,0.94);
    position: relative;
    box-shadow: 0 0 22px var(--morado), 0 0 45px var(--morado-fuerte);
}

.contenedor::before{
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 30px;
    background: linear-gradient(135deg, #7700ee, #9933ff, #bb66ff, #9933ff, #7700ee);
    background-size: 300% 300%;
    animation: bordeAnim 3.2s linear infinite;
    z-index: -1;
    opacity: 0.9;
}

.titulo{
    font-size: 25px;
    font-weight: 900;
    text-align: center;
    color: var(--morado-claro);
    margin-bottom: 4px;
    letter-spacing: 6px;
    text-transform: uppercase;
    animation: brilloTitulo 2.6s infinite;
}

.subtitulo{
    text-align: center;
    font-size: 12px;
    color: var(--morado-fuerte);
    margin-bottom: 26px;
    letter-spacing: 5px;
    font-weight: 600;
}

.lista-opciones{
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
}

.opcion{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-radius: 14px;
    background: rgba(153,51,255,0.05);
    border: 2px solid var(--borde);
    color: var(--texto);
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.28s ease;
}

.opcion:hover{
    border-color: var(--morado-claro);
    background: rgba(153,51,255,0.12);
    transform: translateX(4px);
}

.switch{
    width: 56px;
    height: 30px;
    border-radius: 15px;
    background: #1a0033;
    border: 2px solid var(--morado-fuerte);
    position: relative;
}

.switch::after{
    content: '';
    position: absolute;
    top: 2px; left: 3px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: linear-gradient(90deg, #7700ee, #bb66ff);
    transition: all 0.28s ease;
}

/* === VENTANA VERIFICACIÓN === */
.overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.94);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
}
.overlay.mostrar{ display: flex; }

.ventana-verif{
    width: 100%;
    max-width: 415px;
    background: linear-gradient(145deg, #200040, #080412);
    border-radius: 24px;
    padding: 26px 20px;
    border: 3px solid var(--morado);
    box-shadow: 0 0 35px var(--morado), 0 0 70px var(--morado-fuerte);
    animation: entrada 0.45s ease-out;
}

.ventana-verif.error{
    animation: temblor 0.5s ease;
    border-color: var(--error);
    box-shadow: 0 0 40px var(--error);
}

.titulo-verif{
    font-size: 18px;
    font-weight: 900;
    color: var(--morado-claro);
    text-align: center;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 4px;
}

.paso{
    background: rgba(153,51,255,0.06);
    border: 2px solid rgba(153,51,255,0.25);
    border-radius: 13px;
    padding: 14px 16px;
    margin-bottom: 11px;
    transition: all 0.28s ease;
}
.paso.bloqueado{ opacity:0.4; pointer-events:none; }

.paso-titulo{
    color: var(--texto);
    font-weight: 700;
    font-size: 13.5px;
    margin-bottom: 8px;
    line-height: 1.45;
}

.btn-paso{
    width: 100%;
    padding: 11px 14px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(90deg, #7700ee, #9933ff, #bb66ff);
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.28s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.btn-paso:hover{
    transform: scale(1.04);
    box-shadow: 0 0 18px var(--morado), 0 0 32px var(--morado-claro);
}

.btn-verificar{
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(90deg, #ff3355, #dd1133);
    color: #fff;
    font-size: 15px;
    font-weight: 900;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 14px;
    transition: all 0.3s ease;
    letter-spacing: 3px;
}

.texto-error{
    color: var(--error);
    text-align: center;
    font-weight: 700;
    margin-top: 16px;
    font-size: 14px;
    display: none;
}
.texto-error.mostrar{ display: block; }
</style>
</head>
<body>

<div class="contenedor">
    <h1 class="titulo">DRIP CLIENT FISCAL</h1>
    <p class="subtitulo">SISTEMA ACTIVO • SEGURO</p>

    <div class="lista-opciones">
        <div class="opcion" onclick="abrirVerificacion()">
            <span>AIMBOT CABEZA PRECISO</span>
            <div class="switch"></div>
        </div>
        <div class="opcion" onclick="abrirVerificacion()">
            <span>NO RECOIL TOTAL</span>
            <div class="switch"></div>
        </div>
        <div class="opcion" onclick="abrirVerificacion()">
            <span>ANTI BAN SEGURIDAD</span>
            <div class="switch"></div>
        </div>
        <div class="opcion" onclick="abrirVerificacion()">
            <span>VELOCIDAD DE MIRA</span>
            <div class="switch"></div>
        </div>
        <div class="opcion" onclick="abrirVerificacion()">
            <span>ESQUELETO ENEMIGO</span>
            <div class="switch"></div>
        </div>
        <div class="opcion" onclick="abrirVerificacion()">
            <span>DISPARO AUTOMÁTICO</span>
            <div class="switch"></div>
        </div>
    </div>
</div>

<div class="overlay" id="overlay">
    <div class="ventana-verif" id="ventanaVerif">
        <h2 class="titulo-verif">VERIFICACIÓN OBLIGATORIA</h2>

        <div class="paso" id="paso1">
            <p class="paso-titulo">PASO 1: Seguir el Canal de N DELUXE</p>
            <button class="btn-paso" onclick="irCanal()">IR AL CANAL</button>
        </div>

        <div class="paso bloqueado" id="paso2">
            <p class="paso-titulo">PASO 2: Pasar los anuncios</p>
            <button class="btn-paso" onclick="irAnuncios()">PASAR ANUNCIOS</button>
        </div>

        <button class="btn-verificar" onclick="verificarTodo()">VERIFICAR</button>
        <p class="texto-error" id="textoError">VERIFICACIÓN FALLIDA • REALÍZALO TODO OTRA VEZ</p>
    </div>
</div>

<script>
const CANAL = "https://arthurvipff.github.io/";
const ENLACE_ANUNCIOS = "https://chat.whatsapp.com/KR8fWlbeYBIBBi7EJ1q9nl";

function abrirVerificacion(){
    document.getElementById('overlay').classList.add('mostrar');
    document.getElementById('ventanaVerif').classList.remove('error');
    document.getElementById('textoError').classList.remove('mostrar');
    document.getElementById('paso1').classList.remove('bloqueado');
    document.getElementById('paso2').classList.add('bloqueado');
}

function irCanal(){
    window.open(CANAL, '_blank');
    document.getElementById('paso1').classList.add('bloqueado');
    document.getElementById('paso2').classList.remove('bloqueado');
}

function irAnuncios(){
    window.open(ENLACE_ANUNCIOS, '_blank');
}

function verificarTodo(){
    document.getElementById('ventanaVerif').classList.add('error');
    document.getElementById('textoError').classList.add('mostrar');
}
</script>

</body>
</html>
